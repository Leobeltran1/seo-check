<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#C0F040">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="SEORocket">
  <link rel="apple-touch-icon" href="/icons/icon-192.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Log In — SEORocket</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
:root{--bg:#0B0E1A;--card:#0E1120;--red:#C0F040;--red-glow:rgba(192,240,64,0.25);--off-white:#F4F6FB;--mid:#94a3b8;--dim:#475569;--border:rgba(255,255,255,0.07);}
body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--off-white);min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px;}
.glow{position:fixed;top:20%;left:50%;transform:translateX(-50%);width:600px;height:400px;background:radial-gradient(ellipse,rgba(192,240,64,0.08) 0%,transparent 70%);pointer-events:none;}
.card{background:var(--card);border:1px solid var(--border);border-radius:20px;padding:56px 52px;width:100%;max-width:500px;position:relative;z-index:1;}
.logo{display:flex;align-items:center;justify-content:center;gap:8px;font-size:20px;font-weight:900;margin-bottom:32px;text-decoration:none;color:var(--off-white);}
.logo .r{color:#0B0E1A;}
h1{font-size:30px;font-weight:800;margin-bottom:8px;text-align:center;}
.sub{font-size:14px;color:var(--mid);text-align:center;margin-bottom:32px;}
.field{margin-bottom:18px;}
label{display:block;font-size:13px;font-weight:600;color:var(--mid);margin-bottom:6px;}
input{width:100%;background:rgba(255,255,255,0.04);border:1px solid var(--border);border-radius:12px;padding:14px 18px;font-size:15px;color:var(--off-white);font-family:'Inter',sans-serif;outline:none;transition:border-color .2s;}
input:focus{border-color:#0B0E1A;}
input::placeholder{color:var(--dim);}
.btn-submit{width:100%;background:var(--red);color:#0B0E1A;padding:16px;border-radius:10px;font-size:15px;font-weight:700;cursor:pointer;border:none;font-family:'Inter',sans-serif;transition:all .2s;box-shadow:0 0 24px var(--red-glow);margin-top:8px;}
.btn-submit:hover{transform:translateY(-1px);box-shadow:0 0 40px var(--red-glow);}
.btn-submit:disabled{opacity:0.6;cursor:not-allowed;transform:none;}
.divider{display:flex;align-items:center;gap:12px;margin:20px 0;}
.divider::before,.divider::after{content:'';flex:1;height:1px;background:var(--border);}
.divider span{font-size:12px;color:var(--dim);}
.skip{display:block;text-align:center;font-size:14px;color:var(--mid);transition:color .2s;text-decoration:none;}
.skip:hover{color:var(--off-white);}
.signup-link{text-align:center;font-size:14px;color:var(--mid);margin-top:24px;}
.signup-link a{color:var(--red);font-weight:600;text-decoration:none;}
.msg{border-radius:8px;padding:10px 14px;font-size:13px;margin-bottom:16px;display:none;}
.msg.visible{display:block;}
.msg.err{background:rgba(192,240,64,0.1);border:1px solid rgba(192,240,64,0.3);color:#d4ff70;}
</style>
</head>
<body>
<div class="glow"></div>
<div class="card">
  <a href="index.html" class="logo">🚀 SEO<span class="r">Rocket</span></a>
  <h1>Welcome back</h1>
  <p class="sub">Log in to your SEORocket account.</p>
  <div class="msg err" id="errBox"></div>
  <div class="field"><label>Email address</label><input type="email" id="email" placeholder="you@example.com" autocomplete="email"/></div>
  <div class="field"><label>Password</label><input type="password" id="password" placeholder="Your password"/></div>
  <button class="btn-submit" id="submitBtn" onclick="handleLogin()">Log in →</button>
  <div class="divider"><span>or</span></div>
  <a href="app.html" class="skip">Continue without account →</a>
  <p class="signup-link">Don't have an account? <a href="signup.html">Sign up free</a></p>
</div>
<script>
const SUPABASE_URL = 'https://jjfojqvhcecyxmstpmxl.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_631aiLjc7Kyv1bSNeNSYDg_xbuMdDCD';
async function handleLogin(){
  const email=document.getElementById('email').value.trim();
  const pass=document.getElementById('password').value;
  const err=document.getElementById('errBox');
  const btn=document.getElementById('submitBtn');
  err.classList.remove('visible');
  if(!email||!pass){err.textContent='Please fill in all fields.';err.classList.add('visible');return;}
  btn.textContent='Logging in...';btn.disabled=true;
  try{
    const res=await fetch(SUPABASE_URL+'/auth/v1/token?grant_type=password',{method:'POST',headers:{'Content-Type':'application/json','apikey':SUPABASE_ANON_KEY,'Authorization':'Bearer '+SUPABASE_ANON_KEY},body:JSON.stringify({email,password:pass})});
    const data=await res.json();
    if(data.error||data.error_description){err.textContent=data.error_description||data.error?.message||'Login failed.';err.classList.add('visible');btn.textContent='Log in →';btn.disabled=false;return;}
    localStorage.setItem('SEORocket_token',data.access_token);
    localStorage.setItem('SEORocket_user',JSON.stringify(data.user));
    window.location.href='dashboard.html';
  }catch(e){err.textContent='Could not connect. Please try again.';err.classList.add('visible');btn.textContent='Log in →';btn.disabled=false;}
}
document.addEventListener('keydown',e=>{if(e.key==='Enter')handleLogin();});
</script>
  <script>
    if('serviceWorker' in navigator){
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js')
          .then(r => console.log('SW registered'))
          .catch(e => console.log('SW failed', e));
      });
    }
  </script>
</body>
</html>
