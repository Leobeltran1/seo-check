<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png?v=2">
  <link rel="icon" type="image/png" sizes="16x16" href="/icons/favicon-16.png">
  <link rel="shortcut icon" href="/favicon.ico?v=2">
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
<meta charset="UTF-8">
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#C0F040">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reset Password — SEO Rocket</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
:root{
  --bg:#0B0E1A;
  --card:#0E1120;
  --red:#C0F040;
  --red-glow:rgba(192,240,64,0.25);
  --off-white:#F4F6FB;
  --mid:#94a3b8;
  --dim:#64748b;
  --border:rgba(255,255,255,0.08);
}
body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--off-white);min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px;}
.glow{position:fixed;top:20%;left:50%;transform:translateX(-50%);width:600px;height:400px;background:radial-gradient(ellipse,rgba(192,240,64,0.08) 0%,transparent 70%);pointer-events:none;}
.card{background:var(--card);border:1px solid var(--border);border-radius:20px;padding:56px 52px;width:100%;max-width:500px;position:relative;z-index:1;}
.logo{display:flex;align-items:center;justify-content:center;gap:8px;font-size:20px;font-weight:900;margin-bottom:32px;text-decoration:none;color:var(--off-white);}
h1{font-size:30px;font-weight:800;margin-bottom:8px;text-align:center;}
.sub{font-size:14px;color:var(--mid);text-align:center;margin-bottom:32px;line-height:1.6;}
.field{margin-bottom:18px;}
label{display:block;font-size:13px;font-weight:600;color:var(--mid);margin-bottom:6px;}
input{width:100%;background:rgba(255,255,255,0.04);border:1px solid var(--border);border-radius:12px;padding:14px 18px;font-size:15px;color:var(--off-white);font-family:'Inter',sans-serif;outline:none;transition:border-color .2s;}
input:focus{border-color:var(--off-white);}
input::placeholder{color:var(--dim);}
.btn-submit{width:100%;background:var(--red);color:#0B0E1A;padding:16px;border-radius:10px;font-size:15px;font-weight:700;cursor:pointer;border:none;font-family:'Inter',sans-serif;transition:all .2s;box-shadow:0 0 24px var(--red-glow);margin-top:8px;}
.btn-submit:hover{transform:translateY(-1px);box-shadow:0 0 40px var(--red-glow);}
.btn-submit:disabled{opacity:0.6;cursor:not-allowed;transform:none;}
.back-link{text-align:center;font-size:14px;color:var(--mid);margin-top:24px;}
.back-link a{color:var(--red);font-weight:600;text-decoration:none;}
.msg{border-radius:8px;padding:10px 14px;font-size:13px;margin-bottom:16px;display:none;line-height:1.5;}
.msg.visible{display:block;}
.msg.err{background:rgba(192,240,64,0.1);border:1px solid rgba(192,240,64,0.3);color:#d4ff70;}
.msg.ok{background:rgba(16,185,129,0.1);border:1px solid rgba(16,185,129,0.3);color:#6ee7b7;}
@media(max-width:480px){
  .card{padding:36px 24px;border-radius:16px;}
  h1{font-size:24px;}
}
</style>
</head>
<body>
<div class="glow"></div>

<!-- Step 1: request a reset email -->
<div class="card" id="requestCard">
  <a href="index.html" class="logo"><img src="/icons/icon-48.png" style="width:32px;height:32px;border-radius:50%;object-fit:cover;"> SEO Rocket</a>
  <h1>Forgot your password?</h1>
  <p class="sub">Enter your email address and we'll send you a link to reset it.</p>
  <div class="msg err" id="reqErr"></div>
  <div class="msg ok" id="reqOk"></div>
  <div class="field"><label>Email address</label><input type="email" id="email" placeholder="you@example.com" autocomplete="email"/></div>
  <button class="btn-submit" id="reqBtn" onclick="requestReset()">Send reset link →</button>
  <p class="back-link">Remembered it? <a href="login.html">Back to log in</a></p>
</div>

<!-- Step 2: set a new password (arrived via email link) -->
<div class="card" id="updateCard" style="display:none;">
  <a href="index.html" class="logo"><img src="/icons/icon-48.png" style="width:32px;height:32px;border-radius:50%;object-fit:cover;"> SEO Rocket</a>
  <h1>Set a new password</h1>
  <p class="sub">Choose a new password for your account.</p>
  <div class="msg err" id="updErr"></div>
  <div class="field"><label>New password</label><input type="password" id="newPass" placeholder="Min. 8 characters"/></div>
  <div class="field"><label>Confirm new password</label><input type="password" id="confirmPass" placeholder="Repeat your new password"/></div>
  <button class="btn-submit" id="updBtn" onclick="updatePassword()">Update password →</button>
</div>

<footer style="margin-top:36px;text-align:center;position:relative;z-index:1;">
  <nav style="display:flex;gap:22px;flex-wrap:wrap;justify-content:center;margin-bottom:12px;">
    <a href="index.html" style="color:#94a3b8;font-size:13px;font-weight:500;text-decoration:none;">Home</a>
    <a href="index.html#tools" style="color:#94a3b8;font-size:13px;font-weight:500;text-decoration:none;">Tools</a>
    <a href="app.html" style="color:#94a3b8;font-size:13px;font-weight:500;text-decoration:none;">Launch App</a>
    <a href="login.html" style="color:#94a3b8;font-size:13px;font-weight:500;text-decoration:none;">Log in</a>
    <a href="signup.html" style="color:#94a3b8;font-size:13px;font-weight:500;text-decoration:none;">Sign up</a>
  </nav>
  <p style="color:#64748b;font-size:12px;">© SEO Rocket — Free SEO tools for everyone.</p>
</footer>
<script src="/auth.js"></script>
<script>
/* Supabase puts recovery tokens in the URL hash: #access_token=...&refresh_token=...&type=recovery */
const hashParams = new URLSearchParams(location.hash.replace(/^#/, ''));
const recoveryToken = hashParams.get('type') === 'recovery' ? hashParams.get('access_token') : null;
const recoveryRefresh = hashParams.get('refresh_token');
if(recoveryToken){
  document.getElementById('requestCard').style.display = 'none';
  document.getElementById('updateCard').style.display = 'block';
}

async function requestReset(){
  const email = document.getElementById('email').value.trim();
  const err = document.getElementById('reqErr');
  const ok = document.getElementById('reqOk');
  const btn = document.getElementById('reqBtn');
  err.classList.remove('visible'); ok.classList.remove('visible');
  if(!email){ err.textContent='Please enter your email address.'; err.classList.add('visible'); return; }
  btn.textContent='Sending...'; btn.disabled=true;
  try{
    const res = await fetch(SEOR_URL+'/auth/v1/recover?redirect_to='+encodeURIComponent(location.origin+'/reset-password.html'),{
      method:'POST',
      headers:{'Content-Type':'application/json','apikey':SEOR_KEY},
      body:JSON.stringify({email})
    });
    const data = await res.json().catch(()=>({}));
    if(!res.ok){ err.textContent=data.msg||data.error_description||'Could not send the reset email. Please try again.'; err.classList.add('visible'); btn.textContent='Send reset link →'; btn.disabled=false; return; }
    ok.textContent='Check your inbox — if an account exists for '+email+', a reset link is on its way.'; ok.classList.add('visible');
    btn.textContent='Send reset link →'; btn.disabled=false;
  }catch(e){ err.textContent='Could not connect. Please try again.'; err.classList.add('visible'); btn.textContent='Send reset link →'; btn.disabled=false; }
}

async function updatePassword(){
  const pass = document.getElementById('newPass').value;
  const confirm = document.getElementById('confirmPass').value;
  const err = document.getElementById('updErr');
  const btn = document.getElementById('updBtn');
  err.classList.remove('visible');
  if(!pass||!confirm){ err.textContent='Please fill in both fields.'; err.classList.add('visible'); return; }
  if(pass.length<8){ err.textContent='Password must be at least 8 characters.'; err.classList.add('visible'); return; }
  if(pass!==confirm){ err.textContent='Passwords do not match.'; err.classList.add('visible'); return; }
  btn.textContent='Updating...'; btn.disabled=true;
  try{
    const res = await fetch(SEOR_URL+'/auth/v1/user',{
      method:'PUT',
      headers:{'Content-Type':'application/json','apikey':SEOR_KEY,'Authorization':'Bearer '+recoveryToken},
      body:JSON.stringify({password: pass})
    });
    const data = await res.json();
    if(!res.ok){ err.textContent=data.msg||data.error_description||'Reset link may have expired — request a new one.'; err.classList.add('visible'); btn.textContent='Update password →'; btn.disabled=false; return; }
    seorSaveSession({access_token: recoveryToken, refresh_token: recoveryRefresh, user: data});
    window.location.href = 'dashboard.html';
  }catch(e){ err.textContent='Could not connect. Please try again.'; err.classList.add('visible'); btn.textContent='Update password →'; btn.disabled=false; }
}

document.addEventListener('keydown', e => {
  if(e.key!=='Enter') return;
  if(recoveryToken) updatePassword(); else requestReset();
});
</script>
</body>
</html>
