<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png?v=2">
  <link rel="icon" type="image/png" sizes="16x16" href="/icons/favicon-16.png">
  <link rel="shortcut icon" href="/favicon.ico?v=2">
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
<meta charset="UTF-8">
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#C0F040">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="SEO Rocket">
    <meta name="mobile-web-app-capable" content="yes">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign Up — SEO Rocket</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
:root{
  --bg:#0B0E1A;
  --bg2:#0E1120;
  --card:#0E1120;
  --red:#C0F040;
  --red-glow:rgba(192,240,64,0.25);
  --red-light:rgba(192,240,64,0.1);
  --green:#10b981;
  --green-light:rgba(16,185,129,0.1);
  --yellow:#f59e0b;
  --yellow-light:rgba(245,158,11,0.1);
  --off-white:#F4F6FB;
  --mid:#94a3b8;
  --dim:#64748b;
  --border:rgba(255,255,255,0.08);
  --border2:rgba(255,255,255,0.12);
  --shadow:0 4px 24px rgba(0,0,0,0.4);
  --blue:#3b82f6;
  --blue-light:rgba(59,130,246,0.1);
  --text:#F4F6FB;
}
body{font-family:'Inter',sans-serif;background:#0B0E1A;color:#F4F6FB;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px;}
.glow{position:fixed;top:20%;left:50%;transform:translateX(-50%);width:600px;height:400px;background:radial-gradient(ellipse,rgba(192,240,64,0.08) 0%,transparent 70%);pointer-events:none;}
.card{background:var(--card);border:1px solid var(--border);border-radius:20px;padding:56px 52px;width:100%;max-width:500px;position:relative;z-index:1;}
.logo{display:flex;align-items:center;justify-content:center;gap:8px;font-size:20px;font-weight:900;margin-bottom:32px;text-decoration:none;color:var(--off-white);}
.logo .r{color:#F4F6FB;}
h1{font-size:30px;font-weight:800;margin-bottom:8px;text-align:center;}
.sub{font-size:14px;color:var(--mid);text-align:center;margin-bottom:32px;}
.field{margin-bottom:18px;}
label{display:block;font-size:13px;font-weight:600;color:#94a3b8;margin-bottom:6px;}
input{width:100%;background:rgba(255,255,255,0.04);border:1px solid var(--border);border-radius:12px;padding:14px 18px;font-size:15px;color:#F4F6FB;font-family:'Inter',sans-serif;outline:none;transition:border-color .2s;}
input:focus{border-color:#F4F6FB;}
input::placeholder{color:var(--dim);}
.btn-submit{width:100%;background:var(--red);color:#0B0E1A;padding:16px;border-radius:10px;font-size:15px;font-weight:700;cursor:pointer;border:none;font-family:'Inter',sans-serif;transition:all .2s;box-shadow:0 0 24px var(--red-glow);margin-top:8px;}
.btn-submit:hover{transform:translateY(-1px);box-shadow:0 0 40px var(--red-glow);}
.btn-submit:disabled{opacity:0.6;cursor:not-allowed;transform:none;}
.divider{display:flex;align-items:center;gap:12px;margin:20px 0;}
.divider::before,.divider::after{content:'';flex:1;height:1px;background:var(--border);}
.divider span{font-size:12px;color:var(--dim);}
.skip{display:block;text-align:center;font-size:14px;color:var(--mid);transition:color .2s;text-decoration:none;}
.skip:hover{color:var(--off-white);}
.login-link{text-align:center;font-size:14px;color:var(--mid);margin-top:24px;}
.login-link a{color:var(--red);font-weight:600;text-decoration:none;}
.msg{border-radius:8px;padding:10px 14px;font-size:13px;margin-bottom:16px;display:none;}
.msg.visible{display:block;}
.msg.err{background:rgba(192,240,64,0.1);border:1px solid rgba(192,240,64,0.3);color:#d4ff70;}
.msg.ok{background:rgba(16,185,129,0.1);border:1px solid rgba(16,185,129,0.3);color:#10b981;}
</style>

<style>
@media(max-width:480px){
  .card{padding:36px 24px;border-radius:16px;}
  h1{font-size:24px;}
  .sub{font-size:14px;}
  input{padding:12px 14px;font-size:14px;}
  .btn-submit{padding:14px;font-size:15px;}
}
</style>
</head>
<body>
<div class="glow"></div>
<div class="card">
  <a href="index.html" class="logo"><img src="/icons/icon-48.png" style="width:32px;height:32px;border-radius:50%;object-fit:cover;"> SEO <span style="color:#F4F6FB !important;">Rocket</span></a>
  <h1>Create your account</h1>
  <p class="sub">Free forever. No credit card needed.</p>
  <div class="msg err" id="errBox"></div>
  <div class="msg ok" id="okBox"></div>
  <div class="field"><label>Email address</label><input type="email" id="email" placeholder="you@example.com" autocomplete="email"/></div>
  <div class="field"><label>Password</label><input type="password" id="password" placeholder="Min. 8 characters"/></div>
  <div class="field"><label>Confirm password</label><input type="password" id="confirm" placeholder="Repeat your password"/></div>
  <button class="btn-submit" id="submitBtn" onclick="handleSignup()">Create free account →</button>
  <div class="divider"><span>or</span></div>
  <a href="app.html" class="skip">Continue without account →</a>
  <p class="login-link">Already have an account? <a href="login.html">Log in</a></p>
</div>
<script src="/auth.js"></script>
<script>
async function handleSignup(){
  const email=document.getElementById('email').value.trim();
  const pass=document.getElementById('password').value;
  const confirm=document.getElementById('confirm').value;
  const err=document.getElementById('errBox');
  const ok=document.getElementById('okBox');
  const btn=document.getElementById('submitBtn');
  err.classList.remove('visible');ok.classList.remove('visible');
  if(!email||!pass||!confirm){err.textContent='Please fill in all fields.';err.classList.add('visible');return;}
  if(pass.length<8){err.textContent='Password must be at least 8 characters.';err.classList.add('visible');return;}
  if(pass!==confirm){err.textContent='Passwords do not match.';err.classList.add('visible');return;}
  btn.textContent='Creating account...';btn.disabled=true;
  try{
    const res=await fetch(SEOR_URL+'/auth/v1/signup',{method:'POST',headers:{'Content-Type':'application/json','apikey':SEOR_KEY},body:JSON.stringify({email,password:pass})});
    const data=await res.json();
    if(!res.ok||data.error||data.msg){err.textContent=data.error?.message||data.msg||'Signup failed.';err.classList.add('visible');btn.textContent='Create free account →';btn.disabled=false;return;}
    if(data.access_token){seorSaveSession(data);window.location.href='dashboard.html';return;}
    ok.textContent='Account created! Check your email to confirm then log in.';ok.classList.add('visible');
    btn.textContent='Create free account →';btn.disabled=false;
  }catch(e){err.textContent='Could not connect. Please try again.';err.classList.add('visible');btn.textContent='Create free account →';btn.disabled=false;}
}
document.addEventListener('keydown',e=>{if(e.key==='Enter')handleSignup();});
</script>
  <script>
    if('serviceWorker' in navigator){
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js')
          .then(r => console.log('SW registered'))
          .catch(e => console.log('SW failed', e));
      });
    }
  </script>
</body>
</html>
